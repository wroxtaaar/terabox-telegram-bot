services:
  terabox-worker:
    build: .
    container_name: terabox-vps-worker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18080:18080"
    shm_size: "1gb"
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - terabox_worker_data:/worker/data

volumes:
  terabox_worker_data:
